name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Jobs run in parallel. The e2e test (real `wrangler dev`) is run locally:
# `cargo test -p ocre-cli --test e2e -- --ignored`.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects stable and the wasm32 target.
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --target wasm32-unknown-unknown -p ocre -p blog

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Unit, CLI (fake wrangler) and pseudo-terminal tests; 100% line coverage.
      # crates/ocre/src/runtime only runs inside workerd: the e2e job covers it.
      - run: >
          cargo llvm-cov --workspace --exclude blog
          --ignore-filename-regex 'crates/ocre/src/runtime/'
          --fail-under-lines 100 --show-missing-lines
