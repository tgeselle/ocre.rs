name: CI

# Manual for now (Actions tab > CI > Run workflow): checks run locally.
# To run on every push again: `push: {branches: [main]}` and `pull_request:`.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Jobs run in parallel. The e2e test (real `wrangler dev`) is run locally:
# `cargo test -p ocre-cli --test e2e -- --ignored`.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects stable and the wasm32 target.
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Full-stack (default), API-only (no `html`) and GraphQL builds of the framework.
      - run: cargo check --target wasm32-unknown-unknown -p ocre
      - run: cargo check --target wasm32-unknown-unknown -p ocre --no-default-features
      - run: cargo check --target wasm32-unknown-unknown -p ocre --all-features

  # Rustdoc without warnings (missing docs, broken links), doctests with the
  # default and all features, and docs/api-index.md up to date (rustdoc JSON
  # needs nightly).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p ocre --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --doc -p ocre
      - run: cargo test --doc -p ocre --all-features
      - run: python3 scripts/api-index.py --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Unit, CLI (fake wrangler) and pseudo-terminal tests; 100% line coverage.
      # crates/ocre/src/runtime only runs inside workerd: the e2e test covers it.
      - run: >
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex 'crates/ocre/src/runtime/'
          --fail-under-lines 100 --show-missing-lines

  # What users get: an app from `ocre new` with every generator applied must
  # compile to WebAssembly. Catches generator output the unit tests only read as text.
  generated-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ci-app
      - run: cargo install --path crates/ocre-cli --locked --debug
      - run: ocre new ci-app --starter blog --ocre-path "$PWD/crates/ocre" --yes --json
      - working-directory: ci-app
        run: |
          ocre g auth --json
          ocre g model Memo title:string user:references --json
          ocre g model Author name:string^ bio:text?
          ocre g scaffold Book title:string^ summary:text? pages:integer rating:float? published:boolean released_on:date? settings:json author:references --json
          ocre g api Review body:text stars:integer metadata:json? book:references --graphql --json
          ocre g migration add_isbn_to_books isbn:string? --json
          ocre g migration add_extras_to_books extras:json --json
          ocre g mailer Welcome greeting --json
          ocre g mailbox --json
          ocre g job SendDigest user_id:integer note:text? payload:json? --json
          ocre g job Cleanup --json
          ocre g schedule nightly_cleanup "0 3 * * *" --json
          ocre g scaffold Note title:string body:text? --realtime --json
          ocre g scaffold Photo title:string image:attachment notes:attachment? --json
          ocre g api Document name:string file:attachment? --graphql --json
          ocre g cache --json
          ocre g locale en fr --json
          cargo check --target wasm32-unknown-unknown
