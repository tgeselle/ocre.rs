name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Three jobs in parallel: wall time is the slowest one, not the sum.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects stable and the wasm32 target.
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --target wasm32-unknown-unknown -p ocre -p blog

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Unit, CLI (fake wrangler) and pseudo-terminal tests; 100% line coverage.
      # crates/ocre/src/runtime only runs inside workerd: the e2e job covers it.
      - run: >
          cargo llvm-cov --workspace --exclude blog
          --ignore-filename-regex 'crates/ocre/src/runtime/'
          --fail-under-lines 100 --show-missing-lines

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # worker-build has no prebuilt binaries: compiling it takes ~2.5 min, so
      # keep it (and the wasm-bindgen/wasm-opt/esbuild it downloads) cached.
      - id: worker-build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/worker-codegen
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cache/worker-build
          key: worker-build-0.8.7-${{ runner.os }}
      - if: steps.worker-build.outputs.cache-hit != 'true'
        run: cargo install worker-build@0.8.7 --locked
      # Generated app on the real `wrangler dev` (workerd + local D1).
      - run: cargo test -p ocre-cli --test e2e -- --ignored
