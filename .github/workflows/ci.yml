name: CI

# Manual for now (Actions tab > CI > Run workflow): checks run locally.
# To run on every push again: `push: {branches: [main]}` and `pull_request:`.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Jobs run in parallel. The e2e test (real `cf dev`) is run locally:
# `cargo test -p ocre-cli --test e2e -- --ignored`.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects stable and the wasm32 target.
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Full-stack (default), API-only (no `html`) and GraphQL builds of the framework.
      - run: cargo check --target wasm32-unknown-unknown -p ocre
      - run: cargo check --target wasm32-unknown-unknown -p ocre --no-default-features
      - run: cargo check --target wasm32-unknown-unknown -p ocre --all-features

  # Rustdoc without warnings (missing docs, broken links), doctests with the
  # default and all features, and docs/api-index.md up to date (rustdoc JSON
  # needs nightly).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p ocre --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --doc -p ocre
      - run: cargo test --doc -p ocre --all-features
      - run: python3 scripts/api-index.py --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Unit, CLI (fake cf, wrangler and npm) and pseudo-terminal tests; 100% line coverage.
      # crates/ocre/src/runtime only runs inside workerd: the e2e test covers it.
      - run: >
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex 'crates/ocre/src/runtime/'
          --fail-under-lines 100 --show-missing-lines

  # What users get: an app from `ocre new` (which runs `npm install` of the
  # pinned cf and wrangler) with every generator applied must compile to
  # WebAssembly, and its cloudflare.config.ts must type-check and load with
  # cf's own loader. Catches generator output the unit tests only read as text.
  generated-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ci-app
      - run: cargo install --path crates/ocre-cli --locked --debug
      - run: ocre new ci-app --starter blog --ocre-path "$PWD/crates/ocre" --yes --json
      - working-directory: ci-app
        run: |
          ocre g auth --db-sessions --oauth github --json
          ocre g model Memo title:string user:references --json
          ocre g model Author name:string^ bio:text?
          ocre g scaffold Book title:string^ summary:text? pages:integer rating:float? published:boolean released_on:date? settings:json author:references --json
          ocre g api Review body:text stars:integer metadata:json? book:references --graphql --json
          ocre g migration add_isbn_to_books isbn:string? --json
          ocre g migration add_extras_to_books extras:json --json
          ocre g mailer Welcome greeting --json
          ocre g mailbox --json
          ocre g job SendDigest user_id:integer note:text? payload:json? --json
          ocre g job Cleanup --json
          ocre g schedule nightly_cleanup "0 3 * * *" --json
          ocre g job SendCode user_id:integer --queue urgent --json
          ocre g schedule weekly_digest "every monday at 9am" --json
          ocre g mailer Billing receipt --json
          ocre g scaffold Note title:string body:text? --realtime --json
          ocre g scaffold Photo title:string image:attachment notes:attachment? --json
          ocre g api Document name:string file:attachment? --graphql --json
          ocre g cache --json
          ocre g data countries --json
          ocre g locale en fr --json
          printf 'fr:\n  app:\n    welcome: "Bienvenue"\n' > locales/fr.yml
          # Rich text (Trix), optimistic locking and a self join.
          ocre g scaffold Article title:string body:rich_text summary:rich_text? lock_version:integer cover:attachment? --json
          ocre g api Wiki name:string content:rich_text lock_version:integer --graphql --json
          ocre g model Employee name:string employee:references:manager_id? --json
          ocre g scaffold Remark body:text subject:polymorphic:book,review --json
          ocre g model Sticker label:string owner:polymorphic:book,sticker? --json
          ocre g api Album title:string photos:attachments --json
          ocre g model Gallery name:string images:attachments scans:attachments --json
          ocre g migration add_lock_version_to_books lock_version:integer --json
          # CI workflow, PWA files, a custom domain (type-checked by tsc below).
          ocre g ci --json
          test -f .github/workflows/ci.yml
          ocre g pwa --json
          test -f public/manifest.webmanifest && grep -q manifest.webmanifest templates/layout.html
          ocre domains add app.example.com --json
          ocre domains --json
          ocre secrets fetch MAIL_ADAPTER --json
          # Every field type and alias; enums in forms and JSON.
          ocre g scaffold Task title:string status:enum:todo,doing,done priority:small_int views:big_int? due_at:time? cost:decimal? token:uuid?^ weight:double? done:bool starts_at:date_time? meta:jsonb? author:references:writer_id? --json
          ocre g api Ticket state:enum:open,closed price:decimal code:uuid opens_at:time? --json
          ocre g migration add_state_to_books state:enum:draft,live --json
          # Migration SQL inferred from the name.
          ocre g migration add_index_to_books pages released_on --json
          ocre g migration add_unique_index_to_books isbn --json
          ocre g migration remove_index_from_books pages released_on --json
          ocre g migration rename_summary_to_blurb_in_books --json
          # Controllers and resources.
          ocre g controller Pages about contact --json
          ocre g controller Dashboard --auth --json
          ocre g controller Metrics summary --api --json
          ocre g resource Tag name:string^ color:enum:red,green,blue --json
          ocre g resource Badge label:string --api --json
          # --pretend writes nothing; --skip keeps and --force rewrites existing files.
          ocre g scaffold Draft title:string --pretend --json
          test ! -e src/drafts.rs && test ! -e src/models/draft.rs
          ocre g controller Pages about contact --skip --json
          ocre g controller Pages about contact --force --json
          # destroy undoes a recorded run; the build below proves src/lib.rs is intact.
          ocre g scaffold Temp name:string --json
          ocre destroy scaffold Temp --json
          test ! -e src/temps.rs && test ! -e src/models/temp.rs
          # Template overrides and app generators.
          ocre g override --json
          ocre g override controller/view.html --json
          ocre g controller Help faq --json
          ocre g generator service --json
          ocre g service Billing amount:integer --json
          test -f src/services/billing.rs
          # Application template.
          printf 'g model Label name:string\ng migration add_index_to_labels name\n' > ci.ocre
          ocre template ci.ocre --json
          # Read-only commands (doctor warns about the login and pending
          # migrations, which is fine; it fails on an invalid cloudflare.config.ts).
          ocre version --json
          ocre about --json
          ocre stats --json
          ocre notes --json
          ocre routes --json
          ocre schedules --json
          ocre doctor --json
          npx tsc -p .
          # fmt, clippy, cargo test, the wasm32 check and missing translations.
          ocre ci --json
