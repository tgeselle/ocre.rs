{% extends "layout.html" %}

{% block content %}
<form action="/posts" method="post"
      hx-post="/posts" hx-target="#posts" hx-swap="afterbegin"
      hx-on::after-request="if (event.detail.successful) this.reset()">
  <input name="title" placeholder="Title" required>
  <textarea name="body" placeholder="Write something" rows="4" required></textarea>
  <button type="submit">Publish</button>
</form>

<section id="posts">
  {% for post in posts %}
    {% include "posts/_post.html" %}
  {% endfor %}
</section>
{% endblock %}
