{% extends "layout.html" %}

{% block title %}<%= human_plural %>{% endblock %}

{% block content %}
<h1><%= human_plural %></h1>

<ul>
  {% for <%= singular %> in <%= plural %> %}
  <li><a href="{{ paths::show(<%= singular %>.<%= key %>) }}"><%= human_singular %> {{ <%= singular %>.<%= key %> }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
