{% extends "layout.html" %}

{% block title %}Forgot your password?{% endblock %}

{% block content %}
<h1>Forgot your password?</h1>
{% if let Some(notice) = flash.notice() %}<p class="notice">{{ notice }}</p>{% endif %}
{% if let Some(alert) = flash.alert() %}<p class="alert">{{ alert }}</p>{% endif %}

<form action="/passwords" method="post">
  <label>Email <input type="email" name="email" required autofocus autocomplete="username"></label>
  <button type="submit">Email me reset instructions</button>
</form>

<p><a href="/login">Back to log in</a></p>
{% endblock %}
