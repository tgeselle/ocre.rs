[package]
name = "ocre-cli"
version = "0.1.0"
description = "Command-line tool for Ocre: create, generate, migrate, run and deploy apps."
edition.workspace = true
license.workspace = true
repository.workspace = true
# tests/ mirrors src/ for unit tests (compiled into the binary with `#[path]`);
# only the targets below are test binaries.
autotests = false

[[bin]]
name = "ocre"
path = "src/main.rs"

# Commands against a fake wrangler (tests/support/fake_npx.sh).
[[test]]
name = "cli"
path = "tests/integration/cli.rs"

[[test]]
name = "auth"
path = "tests/integration/auth.rs"

[[test]]
name = "db"
path = "tests/integration/db.rs"

[[test]]
name = "mail"
path = "tests/integration/mail.rs"

[[test]]
name = "routes"
path = "tests/integration/routes.rs"

# `ocre new` in a pseudo-terminal.
[[test]]
name = "wizard"
path = "tests/integration/wizard.rs"

# Generated apps on workerd (`wrangler dev`); ignored by default, run locally with
# `cargo test -p ocre-cli --test e2e -- --ignored`.
[[test]]
name = "e2e"
path = "tests/system/e2e.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cliclack = "0.5.6"
getrandom = "0.4.3"
serde.workspace = true
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
rexpect = "0.7.1"
ureq = "3.4.2"
