[package]
name = "ocre"
version = "0.1.0"
description = "Rails-like Rust web framework for Cloudflare Workers, deployable on the free plan."
edition.workspace = true
license.workspace = true
repository.workspace = true
# Unit tests mirror src/ in tests/ (src/session.rs -> tests/session.rs) and are
# compiled into the library with `#[path]`, so they are not test targets.
autotests = false

[dependencies]
worker.workspace = true
axum.workspace = true
askama = { workspace = true, optional = true }
serde.workspace = true
wasm-bindgen.workspace = true
serde_json = "1.0.151"
tower-service = "0.3.3"
# Encrypted session cookies (AES-256-GCM, key derived with HKDF).
cookie = { version = "0.18.2", features = ["private", "key-expansion", "percent-encode"] }
tower-http = { version = "0.7.1", default-features = false, features = ["cors"] }
# `custom-error-conversion` lets Ocre map its errors so internal details never reach clients.
async-graphql = { version = "7.2.1", default-features = false, features = ["graphiql", "custom-error-conversion"], optional = true }
# Password hashing, random tokens and JWT (HS256).
base64 = "0.22.1"
getrandom = "0.2.17"
hmac = "0.12.1"
sha2 = "0.10.9"

[features]
default = ["html"]
# Server-rendered pages: askama templates, HTML error pages, htmx extractor.
# API-only apps (`ocre new --api`) turn it off.
html = ["dep:askama"]
graphql = ["dep:async-graphql"]

[dev-dependencies]
pollster = "1.0.1"
serde_urlencoded = "0.7.1"

# Random bytes (cookie nonces, salts, tokens) come from WebCrypto on Workers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
# WebCrypto (PBKDF2) and the JavaScript clock.
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

# Workers hash passwords with WebCrypto; native builds (tests) use the same
# algorithm in pure Rust.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
